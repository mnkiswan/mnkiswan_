# Publishes MNKISWAN Tree Village to GitHub Pages: the whole game as a static site, the farm server running inside the
# page (pages/local-server.js), each player's village saved in their own browser.
#
# The repository's Pages setting is "Deploy from a branch": PAGES_BRANCH, folder / (root). This workflow builds the
# site from main and replaces that branch with the built files (the game's source stays on main).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES_BRANCH: mnkiswan-tree-village

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Build the static site
        run: node tools/build-pages.mjs --out dist
      - name: Publish the site to the Pages branch
        working-directory: dist
        run: |
          git init -q -b "$PAGES_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site built from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$PAGES_BRANCH"
